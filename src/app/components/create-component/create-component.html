<h1>Insertar departamento</h1>
<form createform="ngForm">
    <label>Id departamento: </label>
    <input type="number" name="cajaid" #cajaid class="form-control"/>
    <label>Nombre: </label>
    <input type="string" name="cajanombre" #cajanombre class="form-control"/>
    <label>Localidad: </label>
    <input type="string" name="cajalocalidad" #cajalocalidad class="form-control"/>
    <button class="btn btn-info">
        Crear
    </button>
</form>
